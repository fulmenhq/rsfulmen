name: CI
"on":
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
# fulmen-toolbox v0.5.9 glibc runner (goneat v0.6.3). Digest from
# SHA256SUMS-goneat-tools-runner-glibc on that release.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Image rustup lives in /opt (root). UID 1001 cannot install 1.98/1.88 there.
      RUSTUP_HOME: /tmp/rsfulmen-rustup
      CARGO_HOME: /tmp/rsfulmen-cargo
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.9@sha256:412a315241a59fc0313f4e79f182f7f373a04f194174c61b439cf8ba26174d54
      options: --user 1001
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@16c20dfc2b8bc5cd72c3bf5072a9453664776e70 # 1.98.0
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/rsfulmen-cargo/registry
            /tmp/rsfulmen-cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Verify runner + Rust
        run: |
          rustc --version
          cargo --version
          goneat --version | head -n1
          cargo deny --version
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Lint (clippy)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-features
      - name: Run doc tests
        run: cargo test --locked --doc --all-features
      - name: Build
        run: cargo build --locked --all-features
      - name: Build (release)
        run: cargo build --locked --release --all-features
  # Minimal feature builds to catch conditional compilation issues
  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    env:
      RUSTUP_HOME: /tmp/rsfulmen-rustup
      CARGO_HOME: /tmp/rsfulmen-cargo
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.9@sha256:412a315241a59fc0313f4e79f182f7f373a04f194174c61b439cf8ba26174d54
      options: --user 1001
    strategy:
      matrix:
        features:
          - ""  # no features
          - "config"
          - "foundry-core"
          - "foundry-mime-types"
          - "foundry-patterns"
          - "similarity"
          - "schema-validation"
          - "error-handling"
          - "telemetry-metrics"
          - "appidentity"
          - "logging"
          - "fulhash"
          - "pathfinder"
          - "ascii"
          - "fulpack"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@16c20dfc2b8bc5cd72c3bf5072a9453664776e70 # 1.98.0
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /tmp/rsfulmen-cargo/registry
            /tmp/rsfulmen-cargo/git
            target
          key: ${{ runner.os }}-cargo-features-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-${{ matrix.features }}-
            ${{ runner.os }}-cargo-
      - name: Build with feature '${{ matrix.features }}'
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build --locked --no-default-features
          else
            cargo build --locked --no-default-features --features "${{ matrix.features }}"
          fi
      - name: Test with feature '${{ matrix.features }}'
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test --locked --no-default-features
          else
            cargo test --locked --no-default-features --features "${{ matrix.features }}"
          fi
  # MSRV check
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    env:
      RUSTUP_HOME: /tmp/rsfulmen-rustup
      CARGO_HOME: /tmp/rsfulmen-cargo
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.9@sha256:412a315241a59fc0313f4e79f182f7f373a04f194174c61b439cf8ba26174d54
      options: --user 1001
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Rust 1.88
        uses: dtolnay/rust-toolchain@9c73e2f62269c4b1d0240bd5dd1b81de08099bb6 # 1.88.0
      - name: Build
        run: cargo build --locked --all-features
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
      - name: Test
        run: cargo test --locked --all-features
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
  # Supply-chain policy (licenses, bans, advisories, sources).
  # deny.toml is the policy; do not add license exceptions without sign-off.
  # cargo-deny comes from the toolbox runner (not cargo-deny-action).
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    env:
      RUSTUP_HOME: /tmp/rsfulmen-rustup
      CARGO_HOME: /tmp/rsfulmen-cargo
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.9@sha256:412a315241a59fc0313f4e79f182f7f373a04f194174c61b439cf8ba26174d54
      options: --user 1001
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@16c20dfc2b8bc5cd72c3bf5072a9453664776e70 # 1.98.0
      - name: cargo deny (licenses bans advisories sources)
        run: cargo deny --all-features check licenses bans advisories sources
  # Estate 5-way native matrix (storageprims / forgebolt labels).
  # Linux container jobs above keep goneat + cargo-deny; these jobs
  # prove the crate on each desktop/server OS and architecture.
  platform_smoke:
    name: platform-smoke (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # Custom `-s` runners are privately managed. Fork pull_request events
    # stay on GitHub-hosted isolated runners only.
    if: ${{ !matrix.trusted_runner || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            trusted_runner: false
          - runner: ubuntu-latest-arm64-s
            target: aarch64-unknown-linux-gnu
            trusted_runner: true
          - runner: macos-15
            target: aarch64-apple-darwin
            trusted_runner: false
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            trusted_runner: false
          - runner: windows-latest-arm64-s
            target: aarch64-pc-windows-msvc
            trusted_runner: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@16c20dfc2b8bc5cd72c3bf5072a9453664776e70 # 1.98.0
        with:
          components: rustfmt, clippy
      - name: Verify native host
        run: |
          set -euo pipefail
          host=$(rustc -vV | awk '/^host:/{print $2}')
          test "$host" = "${{ matrix.target }}"
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-features
      - name: Build
        run: cargo build --locked --all-features
  platforms:
    name: platforms
    if: always()
    needs: platform_smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Require all native platforms
        run: test "${{ needs.platform_smoke.result }}" = "success"
