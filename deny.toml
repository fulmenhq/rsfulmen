# cargo-deny policy. CI (`.github/workflows/ci.yml` job `cargo deny`) and
# `make deny` run: cargo deny check licenses bans advisories sources
# Do not add license exceptions without maintainer sign-off.
# An empty default allow list is what failed licenses on #18.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "BSD-2-Clause",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "Zlib",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "serde_yaml_ng still depends on unmaintained unsafe-libyaml; no compatible drop-in without a YAML crate change" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
