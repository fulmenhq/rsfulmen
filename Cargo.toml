[package]
name = "rsfulmen"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
authors = ["FulmenHQ <fulmenhq@3leaps.net>"]
description = "Rust helper library for the Fulmen ecosystem - foundry catalogs, config utilities, and cross-platform helpers"
documentation = "https://docs.rs/rsfulmen"
homepage = "https://github.com/fulmenhq/rsfulmen"
repository = "https://github.com/fulmenhq/rsfulmen"
readme = "README.md"
license = "MIT"
keywords = ["fulmen", "config", "utilities", "foundry", "catalogs"]
categories = ["development-tools", "config", "data-structures"]

[lib]
name = "rsfulmen"
path = "src/lib.rs"

[features]
# Keep default behavior for existing users.
default = ["foundry", "config", "crucible", "docscribe", "three-layer-config", "schema-id", "schema-validation", "similarity", "error-handling", "telemetry-metrics", "appidentity", "logging", "fulhash", "pathfinder", "ascii", "fulencode", "fulpack"]

# Foundry feature groups (aligned to Crucible foundry-catalogs v1.1.0).
foundry-core = []
foundry-mime-types = ["foundry-core", "dep:serde_json"]
foundry-patterns = ["foundry-core", "dep:regex", "dep:glob"]
foundry-correlation = ["foundry-core", "dep:uuid"]

# Convenience: enable all foundry catalogs supported by this crate.
foundry = ["foundry-core", "foundry-mime-types", "foundry-patterns", "foundry-correlation"]

# Platform modules.
config = ["dep:dirs"]
appidentity = ["dep:serde_json"]
logging = ["dep:serde_json"]

# Canonical hashing (xxh3-128 default + SHA-256).
fulhash = ["dep:xxhash-rust", "dep:sha2", "dep:hex"]

# Safe filesystem discovery with glob patterns.
pathfinder = ["dep:walkdir", "dep:sha2", "dep:hex", "dep:glob"]

# Canonical archive operations (tar/tar.gz/zip/gzip). Requires pathfinder + fulhash per the standard.
fulpack = ["dep:tar", "dep:flate2", "dep:zip", "dep:serde_json", "fulhash", "pathfinder", "error-handling"]

# Encoding/decoding + normalization helpers.
fulencode = ["dep:base64", "dep:hex", "dep:unicode-normalization"]

# Terminal utilities and Unicode-aware string handling.
ascii = ["dep:unicode-width", "dep:unicode-segmentation"]
crucible = []
docscribe = ["crucible"]
three-layer-config = ["config", "crucible"]

# Lightweight helpers for schema_id tagging + resolution.
schema-id = ["crucible"]

# Standalone algorithm module (promoted from foundry in Crucible v0.4.0).
similarity = ["dep:strsim", "dep:unicode-normalization", "dep:unicode-segmentation"]

# Heavy: JSON Schema validation utilities.
schema-validation = ["crucible", "dep:anyhow", "dep:url", "dep:jsonschema", "dep:serde_json"]

# Canonical error envelope + propagation helpers.
error-handling = ["dep:serde_json"]

# Telemetry + metrics export (taxonomy-backed).
telemetry-metrics = ["dep:serde_json"]

# Everything.
full = ["foundry", "config", "crucible", "docscribe", "schema-validation", "similarity", "error-handling", "telemetry-metrics", "appidentity", "logging", "fulhash", "pathfinder", "ascii", "fulencode", "fulpack"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
# serde_yaml (dtolnay) is deprecated/archived; serde_yaml_ng is the maintained,
# API-compatible continuation fork. Aliased to `serde_yaml` so call sites are unchanged.
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
anyhow = { version = "1.0", optional = true }
url = { version = "2", optional = true }
jsonschema = { version = "0.17", default-features = false, features = ["draft202012"], optional = true }

# Lazy initialization
once_cell = "1.19"


# Error handling
thiserror = "1.0"

# Pattern matching (for foundry patterns)
regex = { version = "1.10", optional = true }
glob = { version = "0.3", optional = true }

# Similarity (for foundry similarity)
strsim = { version = "0.11", optional = true }
unicode-normalization = { version = "0.1", optional = true }
unicode-segmentation = { version = "1.10", optional = true }

# Hashing (for fulhash module)
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
uuid = { version = "1", features = ["v7"], optional = true }

# Filesystem discovery (for pathfinder module)
walkdir = { version = "2", optional = true }

# Archive operations (for fulpack module)
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

# Unicode text handling (for ascii module)
unicode-width = { version = "0.1", optional = true }

# Platform-specific paths (for config module)
dirs = { version = "5.0", optional = true }

[target.'cfg(unix)'.dependencies]
# Runtime signal handling (for signals module on Unix).
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
# Runtime Ctrl+C handling fallback (for signals module on Windows).
ctrlc = "3.4"

[dev-dependencies]
# Testing utilities
rstest = "0.18"
pretty_assertions = "1.4"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
