version: "1.0.0"
# rsfulmen hooks configuration
# Rust-specific commands are handled directly until goneat v0.4.2+ adds Rust DX support
hooks:
  pre-commit:
    # Rust formatting (cargo fmt)
    - command: "cargo"
      args: ["fmt", "--", "--check"]
      priority: 5
      timeout: "30s"
    # Rust linting (cargo clippy)
    - command: "cargo"
      args: ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
      priority: 6
      timeout: "90s"
    # Goneat assessment (format, lint, security for non-Rust files)
    - command: "assess"
      args: ["--check", "--categories", "format,lint,security", "--fail-on", "critical"]
      priority: 10
      timeout: "90s"
  pre-push:
    # Rust formatting check
    - command: "cargo"
      args: ["fmt", "--", "--check"]
      priority: 5
      timeout: "30s"
    # Rust linting
    - command: "cargo"
      args: ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
      priority: 6
      timeout: "90s"
    # Rust tests
    - command: "cargo"
      args: ["test", "--all-features"]
      priority: 7
      timeout: "5m"
    # Goneat assessment (comprehensive)
    - command: "assess"
      args: ["--check", "--categories", "format,lint,security", "--fail-on", "high"]
      priority: 10
      timeout: "2m"
optimization:
  cache_results: true
  content_source: index
  only_changed_files: true
  parallel: auto
